<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3a241c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Grandstand Piano">
  <title>Grandstand Piano</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%23e23d3d' width='32' height='32' rx='6'/%3E%3Crect fill='%23f2c14e' x='6' y='8' width='4' height='16' rx='1'/%3E%3Crect fill='%232f9d57' x='12' y='8' width='4' height='16' rx='1'/%3E%3Crect fill='%232f86c7' x='18' y='8' width='4' height='16' rx='1'/%3E%3Crect fill='%23e85a9b' x='24' y='8' width='4' height='16' rx='1'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="stage">
    <header class="mast">
      <div class="ticket">
        <span class="admit">Admit one</span>
        <h1>Grandstand Piano</h1>
        <p>Old songs for a toy keyboard</p>
      </div>
    </header>

    <section class="book" id="book" aria-label="Songbook">
      <button class="turn prev" type="button" id="prev" aria-label="Previous page">‹</button>
      <article class="spread" id="spread"></article>
      <button class="turn next" type="button" id="next" aria-label="Next page">›</button>
      <nav class="dots" id="dots" aria-label="Pages"></nav>
    </section>

    <section class="deck" id="deck" aria-label="Piano controls">
      <div class="veil" id="veil" hidden>
        <p>The piano is resting.<br>Tap any button to wake it.</p>
      </div>
      <div class="deck-body">
      <div class="deck-row">
        <div class="songs" id="songs"></div>
        <div class="tempo">
          <button type="button" data-deck="tempoDown" aria-label="Slower">−</button>
          <div>
            <div class="lamps" id="lamps"></div>
            <p id="tempo-label">Game</p>
          </div>
          <button type="button" data-deck="tempoUp" aria-label="Faster">+</button>
          <span class="beat" id="beat" aria-hidden="true"></span>
        </div>
        <button class="stop" type="button" data-deck="stop" aria-label="Stop">Stop</button>
      </div>
      <p class="now" id="now" aria-live="polite">Tap a song button, or play the keys.</p>
      <div class="icon-row" id="instruments"></div>
      <div class="icon-row" id="rhythms"></div>
      <div class="sfx-row">
        <div class="icon-row" id="effects"></div>
        <button class="mix" type="button" data-deck="silly" aria-pressed="false">Mix in</button>
      </div>
      <div class="volume">
        <button type="button" data-deck="volDown" aria-label="Quieter">−</button>
        <input id="volume" type="range" min="0" max="100" value="75" aria-label="Volume">
        <button type="button" data-deck="volUp" aria-label="Louder">+</button>
      </div>
      </div>
      <div class="keys" id="keys"></div>
    </section>
  </div>
  <noscript>This songbook needs JavaScript to play.</noscript>
  <script type="module" src="js/app.js?v=6"></script>
</body>
</html>
